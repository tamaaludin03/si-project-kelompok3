<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIMCI – Login Pegawai</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-primary: #1a7a3c;
      --green-light:   #27ae60;
      --green-field:   #2ecc71;
      --green-bg:      #e8f5e9;
      --maroon:        #8b1a4a;
      --maroon-hover:  #a0205a;
      --card-bg:       #ffffff;
      --text-dark:     #1a2b1e;
      --text-mid:      #4a6652;
      --text-soft:     #8aab94;
      --input-bg:      #1e8c44;
      --input-text:    #ffffff;
      --placeholder:   rgba(255,255,255,0.55);
      --radius-card:   20px;
      --radius-input:  10px;
      --shadow-card:   0 24px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 70% at 50% 40%, #d4edda 0%, #b2dfdb 40%, #e0f2f1 100%);
      overflow: hidden;
      position: relative;
    }

    /* ── Decorative blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; background: #81c784; top: -120px; left: -120px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #4db6ac; bottom: -100px; right: -80px; animation-delay: 3s; }
    .blob-3 { width: 260px; height: 260px; background: #ce93d8; top: 40%; left: 10%; animation-delay: 6s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* ── Wrapper ── */
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 10;
      animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Badge ── */
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1.5px solid rgba(39,174,96,0.25);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 700;
      color: var(--green-primary);
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }
    .badge-icon { font-size: 18px; }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      padding: 36px 36px 28px;
      width: 400px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255,255,255,0.9);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--green-primary), var(--green-light), var(--green-field));
      border-radius: var(--radius-card) var(--radius-card) 0 0;
    }

    /* ── Card header ── */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .card-header-text h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .card-header-text p {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.5;
    }
    .logo-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid var(--green-primary);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-primary);
      box-shadow: 0 4px 12px rgba(26,122,60,0.3);
    }
    .logo-circle svg { width: 36px; height: 36px; fill: white; }

    /* ── Field group ── */
    .field-group { margin-bottom: 16px; }
    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }
    .field-label span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--maroon);
    }
    .field-label a {
      font-size: 11px;
      font-weight: 600;
      color: var(--maroon);
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .field-label a:hover { text-decoration: underline; }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      pointer-events: none;
      z-index: 1;
    }
    .input-wrap input {
      width: 100%;
      background: var(--input-bg);
      border: none;
      border-radius: var(--radius-input);
      color: var(--input-text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      padding: 13px 44px 13px 40px;
      outline: none;
      transition: box-shadow 0.2s, background 0.2s;
      letter-spacing: 0.03em;
    }
    .input-wrap input::placeholder { color: var(--placeholder); }
    .input-wrap input:focus {
      box-shadow: 0 0 0 3px rgba(39,174,96,0.4);
      background: #1a7a3c;
    }
    .input-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      padding: 0;
      transition: color 0.2s;
    }
    .input-toggle:hover { color: white; }

    /* ── Remember ── */
    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 6px 0 22px;
    }
    .remember input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--maroon);
      cursor: pointer;
    }
    .remember label {
      font-size: 13px;
      color: var(--text-mid);
      cursor: pointer;
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      background: var(--maroon);
      color: white;
      border: none;
      border-radius: var(--radius-input);
      padding: 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(139,26,74,0.35);
    }
    .btn-login:hover {
      background: var(--maroon-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(139,26,74,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-arrow { font-size: 18px; transition: transform 0.2s; }
    .btn-login:hover .btn-arrow { transform: translateX(4px); }

    /* ── Status badge ── */
    .status-bar {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f0faf3;
      border: 1px solid rgba(39,174,96,0.25);
      border-radius: 50px;
      padding: 6px 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-light);
      box-shadow: 0 0 0 3px rgba(39,174,96,0.25);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(39,174,96,0.25); }
      50%       { box-shadow: 0 0 0 6px rgba(39,174,96,0.1); }
    }
    .status-pill span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-primary);
    }

    /* ── Footer ── */
    .footer-note {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-soft);
      line-height: 1.6;
      max-width: 340px;
    }
    .footer-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 10px;
    }
    .footer-links a {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-soft);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--green-primary); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a2b1e;
      color: white;
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(.22,1,.36,1), opacity 0.4s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrapper">

    <!-- Top badge -->
    <div class="badge">
      <span class="badge-icon">🏥</span>
      SIMCI
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-text">
          <h1>Login Pegawai</h1>
          <p>Please enter your NIP to access<br>the portal.</p>
        </div>
        <div class="logo-circle">
          <!-- Simple tooth icon as SVG placeholder -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C9.5 2 7.5 3.5 6 5c-1 1-2 2.5-2 4.5 0 1.5.5 3 1 4.5.6 1.8 1 3.5 1 5 0 1.1.9 2 2 2 .8 0 1.5-.5 1.8-1.2L12 16l2.2 3.8c.3.7 1 1.2 1.8 1.2 1.1 0 2-.9 2-2 0-1.5.4-3.2 1-5 .5-1.5 1-3 1-4.5 0-2-.8-3.4-2-4.5C16.5 3.5 14.5 2 12 2z"/>
          </svg>
        </div>
      </div>

      <!-- NIP field -->
      <div class="field-group">
        <div class="field-label"><span>NIP</span></div>
        <div class="input-wrap">
          <span class="input-icon">🪪</span>
          <input type="text" id="nip" placeholder="NIP 123456" autocomplete="username"/>
        </div>
      </div>

      <!-- Password field -->
      <div class="field-group">
        <div class="field-label">
          <span>Password</span>
          <a href="#">Forgot Password?</a>
        </div>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
          <button class="input-toggle" type="button" onclick="togglePassword(this)" aria-label="Toggle password">👁️</button>
        </div>
      </div>

      <!-- Remember device -->
      <div class="remember">
        <input type="checkbox" id="remember"/>
        <label for="remember">Remember Device</label>
      </div>

      <!-- Button -->
      <button class="btn-login" onclick="handleLogin()">
        Secure Login <span class="btn-arrow">→</span>
      </button>

      <!-- Status -->
      <div class="status-bar">
        <div class="status-pill">
          <div class="dot"></div>
          <span>System Operational</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="footer-note">
      Authorized academic and clinical staff access only.<br>
      Activity is monitored for security and compliance.
    </p>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">IT Support</a>
      <a href="#">Compliance</a>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    function togglePassword(btn) {
      const input = btn.previousElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function handleLogin() {
      const nip = document.getElementById('nip').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (!nip) { showToast('⚠️ NIP tidak boleh kosong'); return; }
      if (!pass) { showToast('⚠️ Password tidak boleh kosong'); return; }
      showToast('🔐 Memverifikasi kredensial...');
      // TODO: hubungkan ke backend/API
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
