<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMCI Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Satoshi', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div id="loginView" class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
      <h1 class="text-4xl font-bold text-center mb-2">SIMCI</h1>
      <p class="text-center text-slate-500 mb-8">Login Pegawai</p>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2">NIP</label>
          <input id="nip" type="text" class="w-full border rounded-xl px-4 py-3" placeholder="Masukkan NIP" required />
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <input id="password" type="password" class="w-full border rounded-xl px-4 py-3" placeholder="Masukkan password" required />
        </div>

        <button type="submit" class="w-full bg-teal-700 text-white rounded-xl py-3 font-semibold">
          Masuk
        </button>
      </form>

      <p id="loginError" class="hidden mt-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-3"></p>
    </div>

    <div id="dashboardView" class="hidden w-full max-w-5xl">
      <div class="bg-white rounded-3xl shadow-xl p-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
          <div>
            <h2 class="text-3xl font-bold" id="namaUser">Dashboard</h2>
            <p class="text-slate-500" id="infoUser">Memuat data...</p>
          </div>
          <button id="logoutBtn" class="bg-slate-200 px-4 py-2 rounded-xl font-medium">
            Logout
          </button>
        </div>

        <div id="summaryCards" class="grid md:grid-cols-3 gap-4 mb-8"></div>

        <div class="bg-slate-50 rounded-2xl p-6 border mb-6">
          <h3 class="text-xl font-semibold mb-3">Data User</h3>
          <pre id="userJson" class="text-sm whitespace-pre-wrap"></pre>
        </div>

        <div class="bg-slate-50 rounded-2xl p-6 border">
          <h3 class="text-xl font-semibold mb-3">Data Dashboard</h3>
          <pre id="dashboardJson" class="text-sm whitespace-pre-wrap"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const logoutBtn = document.getElementById('logoutBtn');

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.remove('hidden');
    }

    function hideError() {
      loginError.classList.add('hidden');
      loginError.textContent = '';
    }

    function saveToken(token) {
      sessionStorage.setItem('simci_token', token);
    }

    function getToken() {
      return sessionStorage.getItem('simci_token');
    }

    function clearToken() {
      sessionStorage.removeItem('simci_token');
    }

    function renderSummary(summary) {
      const container = document.getElementById('summaryCards');
      container.innerHTML = '';

      Object.entries(summary || {}).forEach(([key, value]) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-50 border rounded-2xl p-5';
        card.innerHTML = `
          <p class="text-sm text-slate-500 mb-2">${key.replaceAll('_', ' ')}</p>
          <p class="text-2xl font-bold">${value}</p>
        `;
        container.appendChild(card);
      });
    }

    async function loadDashboard() {
      const token = getToken();
      if (!token) return;

      const meRes = await fetch(`${API_BASE}/auth/me`, {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (!meRes.ok) throw new Error('Gagal mengambil data user');
      const me = await meRes.json();

      const dashRes = await fetch(`${API_BASE}/auth/dashboard`, {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (!dashRes.ok) throw new Error('Gagal mengambil data dashboard');
      const dashboard = await dashRes.json();

      document.getElementById('namaUser').textContent = me.nama;
      document.getElementById('infoUser').textContent = `${me.jabatan} • ${me.role}`;
      document.getElementById('userJson').textContent = JSON.stringify(me, null, 2);
      document.getElementById('dashboardJson').textContent = JSON.stringify(dashboard, null, 2);

      renderSummary(dashboard.summary);
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const nip = document.getElementById('nip').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ nip, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login gagal');
        }

        saveToken(data.access_token);
        await loadDashboard();
      } catch (err) {
        showError(err.message || 'Terjadi kesalahan');
      }
    });

    logoutBtn.addEventListener('click', () => {
      clearToken();
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    window.addEventListener('load', async () => {
      if (getToken()) {
        try {
          await loadDashboard();
        } catch (e) {
          clearToken();
        }
      }
    });
  </script>
</body>
</html>
