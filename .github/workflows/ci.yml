name: CI Pipeline SIMCI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build aplikasi
        run: npm run build
